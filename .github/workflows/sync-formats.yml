name: Sync converted rule formats

on:
  schedule:
    # UTC 00:00 = 08:00 Beijing time (UTC+8). Change cron here for another hour.
    - cron: '0 0 * * *'
  push:
    branches: [main]
    paths:
      - 'SingBox/**'
      - 'convert.py'
      - '.github/workflows/sync-formats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert SingBox rule-sets
        run: python convert.py

      - name: Commit and push generated rule lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Surge/QuantumultX/Shadowrocket from SingBox"
            git push
          fi
